version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - funlen
    - goconst
    - gocritic
    - godot
    - godox
    - goprintffuncname
    - gosec
    - lll
    - nakedret
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - whitespace
  settings:
    depguard:
      rules:
        repository:
          list-mode: strict
          files:
            - "$all"
          allow:
            - "$gostd"
            - "github.com/tyemirov/RSVP/"
            - "github.com/tyemirov/RSVP$"
            - "cloud.google.com/go/compute/metadata/"
            - "cloud.google.com/go/compute/metadata$"
            - "github.com/gorilla/securecookie/"
            - "github.com/gorilla/securecookie$"
            - "github.com/gorilla/sessions/"
            - "github.com/gorilla/sessions$"
            - "github.com/jinzhu/inflection/"
            - "github.com/jinzhu/inflection$"
            - "github.com/jinzhu/now/"
            - "github.com/jinzhu/now$"
            - "github.com/liyue201/goqr/"
            - "github.com/liyue201/goqr$"
            - "github.com/mattn/go-sqlite3/"
            - "github.com/mattn/go-sqlite3$"
            - "github.com/skip2/go-qrcode/"
            - "github.com/skip2/go-qrcode$"
            - "github.com/tyemirov/GAuss/"
            - "github.com/tyemirov/GAuss$"
            - "github.com/tyemirov/utils/"
            - "github.com/tyemirov/utils$"
            - "github.com/yuin/goldmark/"
            - "github.com/yuin/goldmark$"
            - "golang.org/x/oauth2/"
            - "golang.org/x/oauth2$"
            - "golang.org/x/sys/"
            - "golang.org/x/sys$"
            - "golang.org/x/text/"
            - "golang.org/x/text$"
            - "gorm.io/driver/sqlite/"
            - "gorm.io/driver/sqlite$"
            - "gorm.io/gorm/"
            - "gorm.io/gorm$"
    staticcheck:
      checks:
        - all
    gocritic:
      enabled-checks:
        - commentedOutCode
        - dupImport
        - rangeExprCopy
        - hugeParam
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
