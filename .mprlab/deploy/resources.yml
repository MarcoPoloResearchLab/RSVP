---
mprlab_resources:
  owner: rsvp
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        app-base-url: APP_BASE_URL
        calendar-credential-encryption-key: CALENDAR_CREDENTIAL_ENCRYPTION_KEY
        google-client-id: GOOGLE_CLIENT_ID
        google-client-secret: GOOGLE_CLIENT_SECRET
        tauth-jwt-signing-key: TAUTH_JWT_SIGNING_KEY
        tauth-upstream-url: TAUTH_UPSTREAM_URL
        llm-proxy-secret: LLM_PROXY_SECRET
    - kind: compose_project
      id: runtime
      images:
        - id: rsvp-image
          repository: ghcr.io/marcopoloresearchlab/rsvp
          build:
            context: .
            dockerfile: Dockerfile
            target: runtime
            platforms:
              - linux/amd64
      volumes:
        - id: data
          name: rsvp-data
          retention: retain
      services:
        - id: web
          image: rsvp-image
          placement:
            group: gateway
            cardinality: one
          environment:
            APP_WEBSITE_URL:
              value: https://rsvp.mprlab.com/
            APP_BASE_URL:
              resource: private
              output: app-base-url
            CALENDAR_CREDENTIAL_ENCRYPTION_KEY:
              resource: private
              output: calendar-credential-encryption-key
            DB_NAME:
              value: /app/data/rsvps.db
            GOOGLE_CLIENT_ID:
              resource: private
              output: google-client-id
            GOOGLE_CLIENT_SECRET:
              resource: private
              output: google-client-secret
            TAUTH_JWT_SIGNING_KEY:
              resource: private
              output: tauth-jwt-signing-key
            TAUTH_UPSTREAM_URL:
              resource: private
              output: tauth-upstream-url
            TAUTH_PUBLIC_URL:
              value: https://rsvp-api.mprlab.com
            TAUTH_TENANT_ID:
              value: rsvp-production
            TAUTH_COOKIE_NAME:
              value: rsvp_production_session
            LLM_PROXY_BASE_URL:
              value: https://llm-proxy-api.mprlab.com
            LLM_PROXY_SECRET:
              resource: private
              output: llm-proxy-secret
          mounts:
            - volume: data
              target: /app/data
          ports:
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
    - kind: runtime_capability
      id: web-http
      name: rsvp.http
      version: 1
      project: runtime
      service: web
      endpoint:
        scope: same_host
        scheme: http
        alias: rsvp-web
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    - kind: caddy_route
      id: public
      hostname: rsvp-api.mprlab.com
      listener: https
      handlers:
        - id: web
          path_prefix: /
          upstream: rsvp.http
      tls:
        mode: automatic
    - kind: health_check
      id: public-health
      protocol: http
      url: https://rsvp-api.mprlab.com/healthz
      expected_status: 200
    - kind: github_pages
      id: website
      repository: MarcoPoloResearchLab/RSVP
      branch: gh-pages
      domain: rsvp.mprlab.com
      url: https://rsvp.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile
        target: website
      verification:
        path: /.mprlab-release.json
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: rsvp-production
        display_name: RSVP Production
        origins:
          - https://rsvp.mprlab.com
          - https://rsvp-api.mprlab.com
        google_web_client_id:
          resource: private
          output: google-client-id
        jwt_signing_key:
          resource: private
          output: tauth-jwt-signing-key
        cookie:
          domain: mprlab.com
          session_name: rsvp_production_session
          refresh_name: rsvp_production_refresh
