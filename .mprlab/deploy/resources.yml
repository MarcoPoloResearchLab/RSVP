mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                target: runtime
              id: rsvp-image
        web_bundles:
            - format: directory
              id: website
              source:
                context: .
                dockerfile: Dockerfile
                kind: container
                target: website
    environment:
        private_inputs:
            - id: app-base-url
              variable: APP_BASE_URL
            - id: calendar-credential-encryption-key
              variable: CALENDAR_CREDENTIAL_ENCRYPTION_KEY
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: google-client-id
              variable: GOOGLE_CLIENT_ID
            - id: google-client-secret
              variable: GOOGLE_CLIENT_SECRET
            - id: llm-proxy-secret
              variable: LLM_PROXY_SECRET
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: tauth-jwt-signing-key
              variable: TAUTH_JWT_SIGNING_KEY
            - id: tauth-upstream-url
              variable: TAUTH_UPSTREAM_URL
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 5m
                request: 30s
                shutdown: 30s
                startup: 2m
        observations:
            http:
                - expected_status: 200
                  id: public-health
                  protocol: http
                  url: https://rsvp-api.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 20m
            - name: app-plan-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 4h
            - name: app-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 30m
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: ci
              timeouts:
                completion: 30m
        private_inputs:
            operations: []
    owner: rsvp
    publications:
        ghcr:
            images:
                - artifact: rsvp-image
                  id: rsvp-image
                  repository: ghcr.io/marcopoloresearchlab/rsvp
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: rsvp.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: MarcoPoloResearchLab/RSVP
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  services:
                    - endpoints:
                        - endpoint:
                            alias: rsvp-web
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: web-http
                          name: rsvp.http
                          version: 1
                        - endpoint:
                            alias: runtime-web-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: rsvp.readiness.runtime.web
                          version: 1
                      environment:
                        - input: app-base-url
                          name: APP_BASE_URL
                        - name: APP_WEBSITE_URL
                          value: https://rsvp.mprlab.com/
                        - input: calendar-credential-encryption-key
                          name: CALENDAR_CREDENTIAL_ENCRYPTION_KEY
                        - name: DB_NAME
                          value: /app/data/rsvps.db
                        - input: google-client-id
                          name: GOOGLE_CLIENT_ID
                        - input: google-client-secret
                          name: GOOGLE_CLIENT_SECRET
                        - name: LLM_PROXY_BASE_URL
                          value: https://llm-proxy-api.mprlab.com
                        - input: llm-proxy-secret
                          name: LLM_PROXY_SECRET
                        - name: TAUTH_COOKIE_NAME
                          value: rsvp_production_session
                        - input: tauth-jwt-signing-key
                          name: TAUTH_JWT_SIGNING_KEY
                        - name: TAUTH_PUBLIC_URL
                          value: https://rsvp-api.mprlab.com
                        - name: TAUTH_TENANT_ID
                          value: rsvp-production
                        - input: tauth-upstream-url
                          name: TAUTH_UPSTREAM_URL
                      id: web
                      image:
                        publication: rsvp-image
                      mounts:
                        - target: /app/data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 8080
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: rsvp-data
                      retention: retain
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://rsvp.mprlab.com/
        ingress:
            caddy:
                routes:
                    - handlers:
                        - id: web
                          path_prefix: /
                          upstream: rsvp.http
                      hostname: rsvp-api.mprlab.com
                      id: public
                      listener: https
                      tls:
                        mode: automatic
