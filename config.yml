server:
  address: ":8080"
database:
  name: "${DB_NAME}"
app_base_url: "${APP_BASE_URL}"
website_url: "${APP_WEBSITE_URL}"
tauth:
  jwt_signing_key: "${TAUTH_JWT_SIGNING_KEY}"
  jwt_issuer: tauth
  cookie_name: "${TAUTH_COOKIE_NAME}"
  tenant_id: "${TAUTH_TENANT_ID}"
  url: "${TAUTH_PUBLIC_URL}"
  upstream_url: "${TAUTH_UPSTREAM_URL}"
  login_path: /auth/google
  logout_path: /auth/logout
  nonce_path: /auth/nonce
  session_path: /auth/session
llm_proxy:
  base_url: "${LLM_PROXY_BASE_URL}"
  secret: "${LLM_PROXY_SECRET}"
  provider: ""
  model: ""
  reasoning_effort: low
  request_timeout_seconds: 120
calendar_credential_encryption_key: "${CALENDAR_CREDENTIAL_ENCRYPTION_KEY}"
google_client_id: "${GOOGLE_CLIENT_ID}"
google_client_secret: "${GOOGLE_CLIENT_SECRET}"
google_calendar_authorization_endpoint: https://accounts.google.com/o/oauth2/v2/auth
google_calendar_token_endpoint: https://oauth2.googleapis.com/token
google_calendar_list_endpoint: https://www.googleapis.com/calendar/v3/users/me/calendarList
google_calendar_events_endpoint: https://www.googleapis.com/calendar/v3/calendars
