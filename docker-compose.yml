services:
  natural-language-parser:
    image: rsvp-local-parser:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: natural-language-parser
    command: ["/app/natural-language-fixture"]

  rsvp-app:
    image: rsvp-local:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      - natural-language-parser
    env_file:
      - "${RSVP_RUNTIME_ENV_FILE:?RSVP_RUNTIME_ENV_FILE is required}"
    environment:
      APP_BASE_URL: "${RSVP_PUBLIC_ORIGIN:?RSVP_PUBLIC_ORIGIN is required}/"
      CALENDAR_CREDENTIAL_ENCRYPTION_KEY: "${RSVP_CALENDAR_CREDENTIAL_ENCRYPTION_KEY:?RSVP_CALENDAR_CREDENTIAL_ENCRYPTION_KEY is required}"
      DB_NAME: /app/data/rsvps.db
      GOOGLE_OAUTH2_BASE: "${RSVP_PUBLIC_ORIGIN}"
      NATURAL_LANGUAGE_PARSER_API_KEY: rsvp-local-parser
      NATURAL_LANGUAGE_PARSER_ENDPOINT: http://natural-language-parser:8082/parse
      TLS_CERT_PATH: ""
      TLS_KEY_PATH: ""
    ports:
      - "127.0.0.1:${RSVP_HOST_PORT:-8080}:8080"
    volumes:
      - rsvp-data:/app/data

volumes:
  rsvp-data:
